[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autocoder"
version = "0.1.0"
description = "An autonomous software-engineering agent: understand -> inspect -> plan -> implement -> run -> test -> debug -> verify."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "autocoder" }]
dependencies = [
    # Core has ZERO hard third-party dependencies so the agent loop and tests
    # run in a bare environment. Optional extras enable live providers / the web UI.
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.39"]
openai = ["openai>=1.0"]
web = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]

[project.scripts]
autocoder = "autocoder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
autocoder = ["ui/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
